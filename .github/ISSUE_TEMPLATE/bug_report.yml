name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the issue and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: Include a minimal sample with sensitive data removed.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: dqcheck version
  - type: input
    id: python
    attributes:
      label: Python version
