[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dqcheck"
version = "0.1.0"
description = "A fast, friendly CLI for profiling datasets and enforcing data quality rules."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Aaron Pius" }]
keywords = ["data-quality", "data-profiling", "cli", "csv", "excel", "analytics", "testing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "pandas>=2.1",
  "typer>=0.12",
  "rich>=13.7",
  "PyYAML>=6.0",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]
parquet = ["pyarrow>=15.0"]

[project.scripts]
dqcheck = "dqcheck.cli:app"

[project.urls]
Homepage = "https://github.com/aaronpius/data-quality-cli"
Issues = "https://github.com/aaronpius/data-quality-cli/issues"
Repository = "https://github.com/aaronpius/data-quality-cli"

[tool.hatch.build.targets.wheel]
packages = ["src/dqcheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
